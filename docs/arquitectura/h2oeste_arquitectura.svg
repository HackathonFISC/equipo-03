<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1080" viewBox="0 0 1560 1080" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title id="title">Arquitectura de H2Oeste</title><desc id="desc">Telegram y panel React acceden a FastAPI. Un trabajador despacha cinco agentes que comparten estado transaccional en Supabase. Gemini interpreta; herramientas deterministas calculan y verifican. Una coordinadora aprueba antes de comunicar.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#718b9e" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#12334a}.title{font-size:36px;font-weight:700}.subtitle{font-size:17px;fill:#536e80}.label{font-size:13px;font-weight:700;letter-spacing:2px;fill:#607d8b}.name{font-size:22px;font-weight:700}.body{font-size:16px;fill:#34546a}.tag{font-size:13px;font-weight:700;fill:#166c63}.edge{fill:none;stroke:#718b9e;stroke-width:2;marker-end:url(#arrow)}.line{stroke:#d9e5eb;stroke-width:1}</style><rect width="1560" height="1080" fill="#f4f8fa"/><text x="55" y="58" class="title">H2Oeste · Arquitectura multiagente</text><text x="55" y="89" class="subtitle">Implementación del repositorio · 543ea2d · 17 de octubre de 2026</text><rect x="55" y="135" width="320" height="115" rx="15" fill="#ffffff" stroke="#cadce6"/><text x="75" y="169" class="name">Comunidad · Telegram</text><text x="75" y="197" class="body">Texto, voz, foto y pin fijo</text><text x="75" y="233" class="tag">Reporte y aclaraciones</text><rect x="440" y="135" width="300" height="115" rx="15" fill="#ffffff" stroke="#cadce6"/><text x="460" y="169" class="name">Bot de Telegram</text><text x="460" y="197" class="body">Un receptor por token</text><text x="460" y="233" class="tag">Acceso a través de la API</text><rect x="845" y="135" width="300" height="115" rx="15" fill="#ffffff" stroke="#cadce6"/><text x="865" y="169" class="name">Panel · React / Vite</text><text x="865" y="197" class="body">Reportes, revisión, plan y eventos</text><text x="865" y="233" class="tag">Interfaz de coordinación</text><rect x="1210" y="135" width="295" height="115" rx="15" fill="#ffffff" stroke="#cadce6"/><text x="1230" y="169" class="name">Coordinadora</text><text x="1230" y="197" class="body">Revisa datos y aprueba el plan</text><text x="1230" y="233" class="tag">Identidad verificada</text><path d="M375 190 H440" class="edge"/><path d="M1210 190 H1145" class="edge"/><rect x="260" y="305" width="780" height="113" rx="15" fill="#e5f2f6" stroke="#cadce6"/><text x="280" y="339" class="name">API · FastAPI</text><text x="280" y="367" class="body">Valida contratos, verifica permisos y ejecuta RPC transaccionales.</text><text x="280" y="401" class="tag">HTTP para bot y panel · inicia el trabajador administrado</text><rect x="1120" y="305" width="385" height="113" rx="15" fill="#ffffff" stroke="#cadce6"/><text x="1140" y="339" class="name">Supabase Auth</text><text x="1140" y="367" class="body">Login del panel; token verificado</text><text x="1140" y="401" class="tag">Rol activo: usuarios_operativos</text><path d="M590 250 V305" class="edge"/><path d="M990 250 V278 H940 V305" class="edge"/><path d="M1040 360 H1120" class="edge"/><path d="M1090 250 V274 H1300 V305" class="edge"/><rect x="260" y="463" width="1245" height="104" rx="15" fill="#e5f2f6" stroke="#cadce6"/><text x="280" y="497" class="name">Orquestador · trabajador persistente</text><text x="280" y="525" class="body">Consulta ejecuciones pendientes, reserva una etapa y despacha el agente correspondiente.</text><text x="280" y="550" class="tag">Sondeo: 5 s · estados y transiciones persistidos · coordinación mediante base de datos</text><path d="M650 418 V463" class="edge"/><rect x="55" y="625" width="270" height="145" rx="15" fill="#ffffff" stroke="#cadce6"/><text x="75" y="659" class="name">1 · Ingesta</text><text x="75" y="687" class="body">Interpreta y extrae datos.</text><text x="75" y="709" class="body">Conserva evidencia.</text><text x="75" y="753" class="tag">GEMINI + VALIDACIÓN</text><path d="M325 694 H350" class="edge"/><rect x="350" y="625" width="270" height="145" rx="15" fill="#ffffff" stroke="#cadce6"/><text x="370" y="659" class="name">2 · Territorial</text><text x="370" y="687" class="body">Ubicación y episodio.</text><text x="370" y="709" class="body">Vínculos sin sumar mensajes.</text><text x="370" y="753" class="tag">REGLAS + GEOGRAFÍA</text><path d="M620 694 H645" class="edge"/><rect x="645" y="625" width="270" height="145" rx="15" fill="#ffffff" stroke="#cadce6"/><text x="665" y="659" class="name">3 · Priorización</text><text x="665" y="687" class="body">Valida demanda y ordena.</text><text x="665" y="709" class="body">Pendientes siguen visibles.</text><text x="665" y="753" class="tag">HERRAMIENTAS DE CÁLCULO</text><path d="M915 694 H940" class="edge"/><rect x="940" y="625" width="270" height="145" rx="15" fill="#ffffff" stroke="#cadce6"/><text x="960" y="659" class="name">4 · Planificación</text><text x="960" y="687" class="body">Decisión acotada de IA.</text><text x="960" y="709" class="body">Solver y verificador.</text><text x="960" y="753" class="tag">GEMINI + CÓDIGO</text><path d="M1210 694 H1235" class="edge"/><rect x="1235" y="625" width="270" height="145" rx="15" fill="#ffffff" stroke="#cadce6"/><text x="1255" y="659" class="name">5 · Comunicación</text><text x="1255" y="687" class="body">Genera avisos autorizados.</text><text x="1255" y="709" class="body">No envía Telegram.</text><text x="1255" y="753" class="tag">RPC TRANSACCIONAL</text><path d="M780 567 V595 H190 V625" class="edge"/><text x="815" y="601" class="subtitle">La aprobación humana habilita la etapa de Comunicación.</text><rect x="55" y="820" width="430" height="114" rx="15" fill="#ffffff" stroke="#cadce6"/><text x="75" y="854" class="name">Gemini · interpretación</text><text x="75" y="882" class="body">Extracción, audio, fotos y decisiones</text><text x="75" y="904" class="body">acotadas de Planificación.</text><text x="75" y="917" class="tag">Sin autoridad para aprobar o calcular</text><rect x="530" y="820" width="485" height="114" rx="15" fill="#ffffff" stroke="#cadce6"/><text x="550" y="854" class="name">Herramientas deterministas</text><text x="550" y="882" class="body">validate_need · score_needs</text><text x="550" y="904" class="body">solve_routes (OR-Tools) · verify_plan</text><text x="550" y="917" class="tag">Cantidades, rutas y verificación en código</text><rect x="1060" y="820" width="445" height="114" rx="15" fill="#ffffff" stroke="#cadce6"/><text x="1080" y="854" class="name">Google Maps · opcional</text><text x="1080" y="882" class="body">Geocoding y Routes API</text><text x="1080" y="904" class="body">Ubicación y tiempos viales estimados.</text><text x="1080" y="917" class="tag">No valida demanda ni entrega física</text><rect x="55" y="970" width="1450" height="80" rx="15" fill="#daeee8" stroke="#cadce6"/><text x="75" y="1004" class="name">Supabase · PostgreSQL + PostgREST / RPC</text><text x="75" y="1032" class="body">Reportes · ejecuciones · aclaraciones · incidentes · revisiones · necesidades · planes/versiones · avisos · eventos</text><text x="55" y="799" class="label">SERVICIOS Y HERRAMIENTAS COMPARTIDOS POR LOS AGENTES</text></svg>
